server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: schemaplexai-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 仅展示配置结构；真实连接串和密钥请通过安全环境变量注入。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/schemaplexai}
    username: ${DB_USERNAME:change-me}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:change-me}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/schemaplexai}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400
  refresh-expiration: 604800

schemaplexai:
  agent:
    team:
      checkpoint:
        retention-days: 30
        cleanup-interval-ms: 3600000
  security:
    aes-key: ${AES_SECRET_KEY:}
  sandbox:
    allowed-commands: ${SANDBOX_ALLOWED_COMMANDS:}
