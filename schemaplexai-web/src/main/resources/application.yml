server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: schemaplexai-server
  profiles:
    active: dev

  # Jackson全局配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Servlet配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: sf_
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:schemaplexai-default-jwt-secret-key-32chars}
  expiration: 86400
  refresh-expiration: 604800

# Knife4j API文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] [%X{tenantId}] %logger{36} - %msg%n"
  level:
    com.schemaplexai: DEBUG
    org.springframework: INFO

# 代码沙箱配置（Wasm 隔离执行）
schemaplexai:
  security:
    aes-key: ${AES_SECRET_KEY:}
  sandbox:
    allowed-commands: ${SANDBOX_ALLOWED_COMMANDS:ls,cat,head,tail,grep,find,wc,sort,uniq,diff,echo,pwd,date,whoami}
    code-exec:
      enabled: true
      default-timeout-ms: 5000
      max-timeout-ms: 30000
      max-code-length: 50000
      max-output-length: 24000
      max-concurrent-executions: 4
